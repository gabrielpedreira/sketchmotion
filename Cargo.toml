# Workspace SketchMotion
# Um crate por módulo arquitetural (ver docs/04-estrutura-pastas.md).
# As fronteiras de dependência entre módulos ficam explícitas: se um crate
# tentar importar algo que não declarou, o compilador acusa.
[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/render",
    "crates/tools",
    "crates/input",
    "crates/animation",
    "crates/rigging",
    "crates/color",
    "crates/brush",
    "crates/io",
    "crates/trace",
    "crates/app",
]

# Metadados e configurações compartilhados por todos os crates do workspace.
# Cada crate herda com `x.workspace = true` no seu próprio Cargo.toml.
[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Gabriel Pedreira"]
license = "MIT"
repository = "https://github.com/gabrielpedreira/sketchmotion"

# Perfil de release otimizado (usado quando compilarmos o app final).
[profile.release]
opt-level = 3
lto = true

# Perfil de desenvolvimento ACELERADO: nosso código com otimização leve (compila
# rápido no incremental) e TODAS as dependências totalmente otimizadas (egui,
# image, etc. são compiladas uma vez). Isso tira o travamento ao desenhar em
# `cargo run` (debug), que recompõe o canvas inteiro a cada traço.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
