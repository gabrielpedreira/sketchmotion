[package]
name = "sketchmotion-io"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
sketchmotion-core = { path = "../core" }
sketchmotion-color = { path = "../color" }
# Serialização binária compacta (CBOR) do formato de projeto e das paletas.
ciborium = "0.2"
# Descobre o diretório de dados do usuário (biblioteca global de paletas).
dirs = "5"
# Codecs de imagem para exportação (PNG/JPEG).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
